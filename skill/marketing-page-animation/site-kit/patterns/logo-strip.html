<!-- Logo strip - captured verbatim from https://www.optmyzr.com/ (live homepage).
     Status: observed. 24 divs balanced, 18 <img> (9 logos, duplicated for the mobile marquee).

     This strip lives INSIDE the `hero` component (hero.hugo.html), and the identical markup is
     copy-pasted into `social-hero` and `hero-demo`. That repetition is the convention - do not
     factor it out, and do not build a new one.

     Details that are easy to get wrong:
       - No grayscale and no opacity on the logos. They render at full colour.
       - Logos are `h-[24px] w-auto object-contain mx-auto` inside a `flex-1` wrapper.
       - Mobile (<768px) uses `.partner-logos-scroll`, a 20s linear infinite marquee that pauses
         on hover; the logo set is duplicated so the loop is seamless. Disabled at md and up.
       - The strip is `position: sticky; bottom: 0` via `.bottom-sticky` (styles.css:990).
       - In Hugo the logos come from a `partnerLogos` front-matter array of {alt, image},
         resolved with `resources.Get`; the intro copy is `trustedPartnerTitle`.
       - Fallback alt text is "Partner logo".
-->
