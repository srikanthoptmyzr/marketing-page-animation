<section class="c-comparison-steps-section px-lr py-16 md:py-20 "  style="background-image: url('/images/homepage/steps-pattern.png'); background-size: 90%; background-position: center; background-repeat: no-repeat;">
  <div class="relative flex flex-col lg:flex-row max-w-1440 mx-auto  text-center">
    <div class="flex flex-col w-full ">
      <h2 data-scroll="fade-slide" class="text-mobileHeadlinesH3  mb-[37px] md:mb-[40px]
        md:text-desktopHeadlinesH3 font-dm leading-tight font-semibold">{{ .heading }}</h2>
      <div class="flex flex-col xl:flex-row justify-center gap-[24px] xl:w-8/12 mx-auto p-0 md:pb-3">
        {{range $index, $step := .steps}}
        <div class="flex p-[24px] md:px-5 md:py-3 xl:py-5 w-auto xl:w-1/3 rounded-xl items-center
          {{ if eq $index 1 }} bg-teal-light {{ else }} bg-lime-light {{ end }} 
          text-left gap-4 ">
          <span class="text-mobileHeadlinesH3 md:text-desktopHeadlinesH4 font-bold text-colorSurfaceDarkLightActive">{{ $step.number }}</span>
          <span class="text-desktopSubHeadingsP4 md:text-desktopSubHeadingsP3 {{if eq $index 1}} text-mid {{end}} ">{{ $step.text }}</span>
        </div>
        {{end}}
      </div>
    </div>
  </div>
</section>
