<section class="c-steps-section  px-lr pt-[83px] pb-[64px]  md:pb-[96px]"  style="background-image: url('/images/homepage/steps-pattern.png'); background-size: contain; background-position: center;">
  <div class="relative flex flex-col lg:flex-row max-w-1440 mx-auto  text-center">
    <div class="flex flex-col w-full flex ">
      <h2 data-scroll="fade-slide" class="text-mobileHeadlinesH3 md:text-desktopHeadlinesH2 font-fontFamilyHeadlinesDmSans leading-mobileLineHeight5xl md:leading-desktopLineHeight5xl tracking-mobileLetterSpacingMedium md:tracking-desktopLetterSpacingXl font-semibold">{{ .heading }}</h2>
      <p class="text-colorSurfaceDarkDark md:w-10/12 text-desktopSubHeadingsP4 md:text-desktopSubHeadingsP2  mx-auto leading-desktopLineHeightMedium md:leading-desktopLineHeightXxl tracking-desktopLetterSpacingXxl pt-5 pb-10">{{.subtext}}</p>
      <div class="flex flex-col xl:flex-row justify-center gap-[8px] xl:gap-[24px] xl:w-8/12 mx-auto p-0 md:py-3">
        {{range $index, $step := .steps}}
        <div class="flex px-5 py-3 xl:py-5 w-auto xl:w-1/3 rounded-xl items-center
          {{ if eq $index 1 }} bg-teal-light {{ else }} bg-lime-light {{ end }} 
          text-left gap-4 ">
          <span class="text-colorSurfaceDarkLightActive text-mobileHeadlinesH4 md:text-desktopHeadlinesH4 text-colorSurfaceDarkNormalInactive font-bold leading-mobileLineHeight2xl md:leading-desktopLineHeight2xl tracking-mobileLetterSpacingLarge md:tracking-desktopLetterSpacingMedium">{{ $step.number }}</span>
          <span class="text-desktopSubHeadingsP4 md:text-desktopSubHeadingsP3  {{if eq $index 1}} text-mid {{end}} leading-desktopLineHeightMedium md:leading-desktopLineHeightLarge tracking-desktopLetterSpacingXxl">{{ $step.text }}</span>
        </div>
        {{end}}
      </div>
      <div class="flex flex-col items-center text-center mt-5">
        <h2 class="text-mobileBodyB4 md:text-desktopSubHeadingsP4  leading-mobileLineHeightLarge md:leading-desktopLineHeightMedium tracking-mobileLetterSpacingXxl md:tracking-desktopLetterSpacingXxl mb-5 mt-2">{{.kicker}}</h2>
        <div class="scale-[0.89] md:scale-100 flex flex-wrap justify-center gap-x-6 gap-y-6 lg:gap-x-16 xl:gap-x-20">
          <!-- Ad Platforms -->
          {{range .platforms}}
            <div class="flex flex-col items-center">
              <div class="flex flex-col p-[10px] h-[50px] w-[50px] items-center space-y-2  border rounded-full">
                <img src="{{.image}}" alt="" class="w-full h-full object-contain">
              </div>
              <p class="text-colorSurfaceDarkDark text-desktopSubHeadingsP5 md:text-desktopSubHeadingsP4 font-medium leading-desktopLineHeightSmall md:leading-desktopLineHeightMedium tracking-desktopLetterSpacingXxl mt-2">{{.name}}</p>
            </div>
          {{end}}
        </div>
      </div>
    </div>
  </div>
</section>
