<section class="c-comparison-benefits px-lr pt-[64px] pb-[48px] md:pt-[96px] md:pb-[96px]   bg-colorSurfaceLightWhiteHover">
  <div class="mx-auto max-w-1440 flex flex-col md:flex-row justify-between items-center xl:px-[114px]">
    <div class="w-full md:w-[60%] pr-0 md:pr-8 mb-[20px] md:mb-0 ">
      <h2 class="text-center md:text-left font-dm
        text-mobileHeadlinesH3 md:text-desktopHeadlinesH3 
        lg:tracking-desktopLetterSpacingMedium font-bold mb-[20px] md:mb-[32px] leading-mobileLineHeight5xl tracking-mobileLetterSpacingMedium text-colorSurfaceDarkDarkActive lg:leading-desktopLineHeight4xl">{{.heading}}</h2>
      <ul class="space-y-4 lg:w-[84%]">
        {{ range .benefits }}
        <li class="flex items-start">
          <div class="flex-shrink-0 mt-1">

            </svg>
          </div>
          <p class="ml-2 text-colorSurfaceDarkNormalActive text-desktopSubHeadingsP5 lg:text-desktopSubHeadingsP4">{{ .text }}</p>
        </li>
        {{ end }}
      </ul>
      <div class="hidden md:flex gap-[20px] mt-4 md:mt-8">
        {{with .trialBtn}}
        <a href="{{.url}}" class="rounded-lg font-bold text-desktopSubHeadingsP4 bg-colorPrimaryTealDark hover:bg-colorPrimaryTealNormalHover
          text-colorSurfaceLightWhite w-[127px] sm:w-[207px] py-3 text-center capitalize">
          {{.text}}
        </a>
        {{end}}
        {{with .demoBtn}}
        <a href="{{.url}}" class="rounded-lg font-bold text-desktopSubHeadingsP4 bg-colorPrimaryTealLight hover:bg-colorPrimaryTealLightHover
          text-colorPrimaryTealDark w-[127px] sm:w-[207px] py-3 text-center capitalize">
          {{.text}}
        </a>
        {{end}}
      </div>
    </div>

    <div class="w-full md:w-[40%] relative">
      <img src="/images/comparison/benefits-illustrations.webp" alt="Comparison illustration" class="w-full"/>
    </div>  
  </div>
</section>
