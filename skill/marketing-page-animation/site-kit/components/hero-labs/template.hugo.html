<style>

.labs-partners-bg{
  background-image: url('/images/blog-hub/hero-bg.webp'); 
  background-size: cover; 
  background-position: 17%;
}

@media (max-width: 768px) {
  .labs-partners-bg{
    background-image: url('/images/partners/mobile-bg.png'); 
    background-size: 100%; 
    background-position: bottom center;
    background-repeat:no-repeat;
  }
}

</style>
<section class="c-hero-labs lg:flex px-lr bg-surface-dark-darker-hover labs-partners-bg">
  <div class="text-center max-w-1440 mx-auto  flex flex-col items-center py-[48px] md:py-[75px]">
    <h1 class="text-colorSurfaceLightWhite font-dm text-mobileHeadlinesH2 md:text-desktopHeadlinesH1 font-bold mb-[24px] 
      md:mb-[16px] leading-mobileLineHeight6xl md:leading-desktopLineHeight6xl tracking-desktopLetterSpacingXs text-center">
      {{.heading}}
    </h1>
    <p class="text-colorSurfaceLightWhite text-mobileBodyB2 md:text-desktopSubHeadingsP2 mb-[24px] leading-mobileLineHeight3xl 
      md:leading-desktopLineHeightXxl tracking-desktopLetterSpacingXxl w-full md:w-[65%] text-center">
      {{.hero_description}}
    </p>
    {{with .btn_text}}
    <a href="{{$.btn_url}}" class="bg-teal-dark w-[203px] h-[41px] md:h-[48px] md:w-[210px] text-colorSurfaceLightWhite py-3 
       text-desktopSubHeadingsP5 md:text-desktopSubHeadingsP4 font-semibold rounded-xl hover:bg-colorPrimaryTealNormalHover
      text-center inline-flex items-center justify-center gap-[10px]">{{.}}
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.33358 5.53176L3.99343 0.191706C3.86992 0.068097 3.70504 0 3.52924 0C3.35343 0 3.18856 0.068097 3.06504 0.191706L2.67178 0.584873C2.41588 0.841066 2.41588 1.25745 2.67178 1.51326L7.15604 5.99751L2.6668 10.4867C2.54329 10.6104 2.4751 10.7751 2.4751 10.9508C2.4751 11.1267 2.54329 11.2915 2.6668 11.4152L3.06007 11.8083C3.18368 11.9319 3.34846 12 3.52426 12C3.70006 12 3.86494 11.9319 3.98845 11.8083L9.33358 6.46336C9.45738 6.33936 9.52538 6.1738 9.52499 5.99781C9.52538 5.82112 9.45738 5.65566 9.33358 5.53176Z" fill="white"/>
      </svg>
    </a>
    {{end}}
  </div>   
</section>
