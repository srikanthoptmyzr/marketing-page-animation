<section class="c-ppc-youtube-section pb-[96px]">
  <div class="mx-auto max-w-1440 flex flex-col lg:flex-row items-center gap-[24px] px-[16px] xl:px-[48px] 2xl:px-[162px]">
    <!-- Left Column -->
    <div class="w-full lg:w-1/2 space-y-[16px]">
      <div class="inline-block px-4 py-1 rounded-full bg-[#FDEAF0] text-[#8B1A3C] text-desktopSubHeadingsP5 
        md:text-desktopSubHeadingsP4 font-medium leading-desktopLineHeightSmall md:leading-desktopLineHeightMedium 
        tracking-desktopLetterSpacingXxl text-center align-middle"> {{.kicker}} </div>
      <h1 class="text-mobileHeadlinesH3 md:text-desktopHeadlinesH2 leading-mobileLineHeight5xl md:leading-desktopLineHeight5xl
        tracking-desktopLetterSpacingXl font-bold font-dm capitalize"> {{.heading}} </h1>

      <p class="text-desktopSubHeadingsP5 md:text-desktopSubHeadingsP3 text-[#484F59] font-medium leading-desktopLineHeightSmall
        md:leading-desktopLineHeightLarge tracking-desktopLetterSpacingXxl"> {{.subtext}} </p>
    </div>
    <!-- Right Column - Video -->
    <div class="w-full lg:w-1/2 aspect-video bg-gray-800 rounded-lg overflow-hidden">
        {{- $src := .youtubeVideoId -}}
        {{- if $src -}}
          {{- $videoid := partial "bookshop/shared/hugo/youtube-id.hugo.html" $src -}}
          <lite-youtube nocookie="true" videoid="{{ $videoid }}" posterloading="eager"></lite-youtube>
        {{- end -}}
    </div>
  </div>
</section>
